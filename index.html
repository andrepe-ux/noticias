<!doctype html>
<html lang="pt">
<head>
<link rel="icon" href="https://img.icons8.com/ios-filled/50/000000/news.png" type="image/png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WEB-Notícias</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #4caf50;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    #editor {
      min-height: 200px;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 p-4">
<header class="mb-6">
  <h1 class="text-2xl font-bold">MERCADONA</h1>
  <div class="flex flex-wrap items-center gap-3 mt-2">
    <label class="flex items-center gap-1">
      Dias a mostrar:
      <input id="dias" type="number" value="5" min="1" max="30" class="border rounded px-2 py-1 w-16">
    </label>
    <button id="refresh" class="px-3 py-1 border rounded bg-white shadow">Atualizar agora</button>
  </div>
</header>

<main class="grid grid-cols-1 md:grid-cols-2 gap-6">

  <!-- Notícias Código do Trabalho -->
  <section class="bg-white rounded-xl shadow p-4" id="gn-card">
    <h2 class="text-lg font-semibold mb-2">Notícias sobre Código do Trabalho</h2>
    <div id="gn-list" class="text-sm text-gray-500 min-h-[150px] max-h-96 overflow-y-auto">
      <div class="flex justify-center items-center h-full">
        <span class="spinner mr-2"></span> A carregar...
      </div>
    </div>
  </section>

  <!-- Tema livre -->
  <section class="bg-white rounded-xl shadow p-4" id="gn-livre-card">
    <h2 class="text-lg font-semibold mb-2">Tema livre</h2>
    <div class="mb-2">
      <input id="temaLivre" type="text" placeholder="Escreva o seu tema"
             class="w-full px-2 py-1 border rounded">
    </div>
    <div id="gn-livre-list" class="text-sm text-gray-500 min-h-[150px] max-h-96 overflow-y-auto">
      <div class="flex justify-center items-center h-full">
        <span class="spinner mr-2"></span> A carregar...
      </div>
    </div>
  </section>

  <!-- Notícias Gerais -->
  <section class="bg-white rounded-xl shadow p-4" id="gn-gerais-card">
    <h2 class="text-lg font-semibold mb-2">Notícias Gerais</h2>
    <div id="gn-gerais-list" class="text-sm text-gray-500 min-h-[150px] max-h-96 overflow-y-auto">
      <div class="flex justify-center items-center h-full">
        <span class="spinner mr-2"></span> A carregar...
      </div>
    </div>
  </section>

  <!-- Orçamento de Estado -->
  <section class="bg-white rounded-xl shadow p-4" id="oe-card">
    <h2 class="text-lg font-semibold mb-2">Orçamento de Estado 2026</h2>
    <div id="oe-list" class="text-sm text-gray-500 min-h-[150px] max-h-96 overflow-y-auto">
      <div class="flex justify-center items-center h-full">
        <span class="spinner mr-2"></span> A carregar...
      </div>
    </div>
  </section>

  <!-- Apontamentos -->
  <section class="bg-white rounded-xl shadow p-4 col-span-1 md:col-span-2" id="apontamentos">
    <h2 class="text-lg font-semibold mb-2">Apontamentos</h2>
    <div class="flex flex-wrap gap-2 mb-2">
      <button onclick="document.execCommand('bold')" class="px-2 py-1 border rounded">Negrito</button>
      <button onclick="document.execCommand('underline')" class="px-2 py-1 border rounded">Sublinhado</button>
      <button onclick="document.execCommand('strikeThrough')" class="px-2 py-1 border rounded">Rasurado</button>
      <button onclick="document.execCommand('insertOrderedList')" class="px-2 py-1 border rounded">Lista</button>
      <input type="color" id="colorPicker" title="Cor da letra" class="w-10 h-8 border rounded">
      <button id="exportTxt" class="px-2 py-1 border rounded">Exportar .txt</button>
    </div>
    <div id="editor" contenteditable="true" class="border rounded p-2 bg-gray-50"></div>
  </section>

</main>

<!-- Sidebar -->
<div class="fixed top-4 right-4 bg-white p-4 rounded-xl shadow w-60 text-sm">
  <h2 class="font-semibold text-base mb-2">PORTUGAL</h2>
  <div class="mb-2 flex items-center gap-2">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5c/Flag_of_Portugal.svg" class="w-5 h-3"> 
    <span id="time">00:00:00</span>
  </div>
  <div class="mb-2 flex items-center gap-2">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Flag_of_Spain.svg" class="w-5 h-3"> 
    <span id="time-spain">00:00:00</span>
  </div>
  <div class="italic text-gray-600" id="quote">Frase motivacional do dia...</div>
</div>

<script>
// Referências
const elements = {
  dias: document.getElementById('dias'),
  temaLivre: document.getElementById('temaLivre'),
  refresh: document.getElementById('refresh'),
  gnList: document.getElementById('gn-list'),
  gnLivreList: document.getElementById('gn-livre-list'),
  gnGeraisList: document.getElementById('gn-gerais-list'),
  oeList: document.getElementById('oe-list'),
  time: document.getElementById('time'),
  timeSpain: document.getElementById('time-spain'),
  quote: document.getElementById('quote'),
  editor: document.getElementById('editor'),
  colorPicker: document.getElementById('colorPicker'),
  exportTxt: document.getElementById('exportTxt')
};

// Função spinner
function loadingMessage(container) {
  container.innerHTML = `<div class="flex justify-center items-center h-full">
    <span class="spinner mr-2"></span> A carregar...
  </div>`;
}

// Frases motivacionais
const quotes = [
  "O que não cambia é o cambio.",
  "Acredite em si e todo o resto virá.",
  "O único limite é aquele que você coloca em si mesmo.",
  "Cada dia é uma nova oportunidade de mudar sua vida.",
  "O sucesso começa com a decisão de tentar.",
  "Não desista, a vitória pode estar logo à frente!",
  "Persistência transforma impossíveis em conquistas.",
  "A disciplina vence a motivação passageira.",
  "Pequenos passos constroem grandes jornadas.",
  "Seja a mudança que você deseja ver no mundo.",
  "A coragem é o primeiro passo para o sucesso."
];

// Hora
function updateClock() {
  const now = new Date();
  elements.time.innerHTML = now.toLocaleTimeString('pt-PT',{hour12:false,timeZone:'Europe/Lisbon'});
  elements.timeSpain.innerHTML = now.toLocaleTimeString('es-ES',{hour12:false,timeZone:'Europe/Madrid'});
}
setInterval(updateClock,1000);

// Frase do dia
function getDayOfYear(d=new Date()){const s=new Date(d.getFullYear(),0,0);return Math.floor((d-s)/(1000*60*60*24));}
function setMotivationalQuote(){elements.quote.innerHTML='"'+quotes[getDayOfYear()%quotes.length]+'"';}
setMotivationalQuote();

// RSS
function buildProxyUrl(url){return 'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url);}
async function fetchFeed(url){const r=await fetch(buildProxyUrl(url));if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
function parseRssItems(feedJson){if(!feedJson.items)return[];return feedJson.items.map(it=>({title:it.title,link:it.link,pubDate:new Date(it.pubDate),description:it.description}));}
function isWithinDays(date,days){if(!date)return false;const diff=(new Date()-date)/(1000*60*60*24);return diff<=days;}

async function loadNews(term,container,dias){
  loadingMessage(container);
  let feed;
  if(term){
    const q=encodeURIComponent(term+' site:pt');
    feed=`https://news.google.com/rss/search?q=${q}&hl=pt-PT&gl=PT&ceid=PT:pt`;
  } else {
    feed=`https://news.google.com/rss?hl=pt-PT&gl=PT&ceid=PT:pt`; // feed geral
  }
  try{
    const data=await fetchFeed(feed);
    let items=parseRssItems(data).filter(it=>isWithinDays(it.pubDate,dias)).sort((a,b)=>b.pubDate-a.pubDate);
    renderList(container,items.slice(0,50),dias);
  }catch(e){
    container.innerHTML=`<p class="text-red-500">Erro a carregar notícias: ${e.message}</p>`;
  }
}

function renderList(container,items,dias){
  if(!items.length){container.innerHTML=`<p class="text-gray-500">Sem resultados nos últimos ${dias} dia(s).</p>`;return;}
  container.innerHTML=items.map(it=>`
    <div class="mb-3 border-b border-gray-200 pb-2 last:border-b-0">
      <div class="font-medium text-green-700"><a href="${it.link}" target="_blank">${it.title}</a></div>
      <div class="text-xs text-gray-400">${it.pubDate.toLocaleString()}</div>
      <div class="text-sm text-gray-600">${it.description?.replace(/<[^>]+>/g,'').slice(0,240)}</div>
    </div>`).join('');
}

// Refresh
async function refresh(){
  const dias=parseInt(elements.dias.value)||5;
  [elements.gnList,elements.gnLivreList,elements.gnGeraisList,elements.oeList].forEach(c=>loadingMessage(c));
  const tema=elements.temaLivre.value.trim();
  await Promise.all([
    loadNews('código do trabalho',elements.gnList,dias),
    tema ? loadNews(tema,elements.gnLivreList,dias) : elements.gnLivreList.innerHTML='<p class="text-gray-500">Nenhum tema livre indicado.</p>',
    loadNews('',elements.gnGeraisList,dias),
    loadNews('Orçamento de Estado 2026',elements.oeList,dias)
  ]);
}
elements.refresh.addEventListener('click',refresh);
elements.temaLivre.addEventListener('keydown',e=>{if(e.key==='Enter')refresh();});
refresh();

// Apontamentos
elements.colorPicker.addEventListener('input',()=>{document.execCommand('foreColor',false,elements.colorPicker.value);});
elements.exportTxt.addEventListener('click',()=>{
  const text=elements.editor.innerText;
  const blob=new Blob([text],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='apontamentos.txt';a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
